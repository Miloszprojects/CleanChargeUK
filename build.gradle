plugins {
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.milo'
version = '0.0.1-SNAPSHOT'

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    repositories { mavenCentral() }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }
}
