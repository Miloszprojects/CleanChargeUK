version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./cleancharge-backend
      dockerfile: Dockerfile
    container_name: cleancharge-backend
    env_file:
      - .env.backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./cleancharge-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: cleancharge-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
